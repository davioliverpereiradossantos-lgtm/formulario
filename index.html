<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="css/style.css">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>formulario</title>
</head>
<body>
	<header class="retangulo">
    	<div class="conteudo-topo">
      		<h1 class="titulo-evento">Crie e compartilhe<br>seu evento.</h1>
       		<p class="subtitulo-evento">O primeiro passo, é preencher esse formulário de inscrição.</p>
    	</div>
    </header>

    <form class="formulario">
        <h2 class="topo">Informações do Evento</h2>
        <hr class="separador">
        <label class="minititulo">Título do Evento <span>(mínimo 8 caracteres)</span></label>
        <input class="input" type="" name="">
         <label class="minititulo">Link do Evento <span>(comece com https://)</span></label>
        <input class="input" type="" name="">
        <label class="minititulo">Whatsapp para Contato <span>(somente números)</span></label>
        <input class="input" type="" name="">
        <label class="minititulo">Informações extras</label>
        <input class="inputcaixa2" type="" name="">
        <label class="minititulo">Categoria</label>
        <label>.</label>
            <select class="input select">
                <option value="" disabled selected hidden>Tipo do evento</option>
                <option value="workshop">Workshop</option>
                <option value="palestra">Palestra</option>
            </select>
        <h3 class='topo'>Privacidade</h3>
        <hr class="separador">
        <label class="minititulo">E-Mail do Administrador <span>(digite um email válido)</span></label>
        <input class="input" type="" name="">
        <label class="minititulo">Senha de Acesso Para os Participantes <span>(mínimo 8 caracteres)</span></label>
        <input class="input" type="" name="">
        <label class="checkbox-container">
            <input type="checkbox" checked><span class="custom-checkbox"></span>Evento privado
        </label>
        <h4 class="topo">Dia e Hora</h4>
        <hr class="separador">
        <div class="horarios">
            <div class="campo-grupo grupo-data">
                <label for="data">Data</label>
                <input type="" id="data">
            </div>
  
            <div class="campo-grupo grupo-hora">
                <label for="das">Das</label>
                <input type="" id="das" placeholder="19:00">
            </div>
  
            <div class="campo-grupo grupo-hora">
                <label for="ate">Até</label>
                <input type="" id="ate" placeholder="20:00">
            </div>
        </div>
        
    </form>

    <div class="rodape-formulario">
        <div class="btn-salvar-visual">Salvar evento</div>
    </div>


        


   
</body>
</html>
